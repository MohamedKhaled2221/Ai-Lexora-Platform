[project]
name = "ai-lexora"
version = "0.1.0"
description = "Local multilingual Legal Intelligence Assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Shared / M2
    "FlagEmbedding",
    "torch",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "psutil",
    # M3 retrieval
    "qdrant-client>=1.7.0",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.2",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    # M4 orchestration
    "langchain-core",
    "langchain-ollama",
    "httpx",
    "ollama",
    # Delivery API
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
