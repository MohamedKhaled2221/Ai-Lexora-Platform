[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    ocr: requires a working OCR engine; slow (minutes)
    docling: requires Docling model weights; slow (minutes)
    slow: takes more than a few seconds

# PaddleOCR, Docling and transformers emit a great deal of import-time noise
# that has nothing to do with our code.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
